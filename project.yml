name: LlamaChat
options:
  bundleIdPrefix: com.bangmujer
  deploymentTarget:
    iOS: "17.0"
  # Pola yang sama seperti proyek MDM: XcodeGen men-generate .xcodeproj di CI.
  # File .xcodeproj TIDAK di-commit; sumber kebenarannya adalah file ini.
  xcodeVersion: "16.0"
targets:
  LlamaChat:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources
    # llama.xcframework DIBANGUN di CI (lihat .github/workflows/build-ipa.yml)
    # dan diletakkan di ThirdParty/llama.xcframework SEBELUM `xcodegen generate`.
    # XcodeGen menangani Framework Search Paths + embedding dari deklarasi ini;
    # tidak ada Framework Search Path manual di Xcode.
    dependencies:
      - framework: ThirdParty/llama.xcframework
        embed: true
    # PELAJARAN dari proyek MDM (2026-11-23): XcodeGen MENIMPA Info.plist
    # di info.path pada setiap `xcodegen generate`. Kunci custom WAJIB di sini,
    # bukan hanya di file Info.plist tulisan tangan.
    info:
      path: Sources/Resources/Info.plist
      properties:
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        CFBundleIconName: AppIcon
        CFBundleDisplayName: "LlamaChat"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        # Fase A tidak memakai jaringan sama sekali di runtime.
        # NSAppTransportSecurity sengaja TIDAK dilonggarkan di sini.
        # Download model (Fase C) memakai HTTPS standar; pengecualian
        # http hanya ditambahkan nanti kalau ada kebutuhan yang terbukti.
        UIBackgroundModes:
          - fetch
        # Izin agent Fase 2: teks yang ditampilkan iOS saat pertama
        # kali tool meminta akses. Tanpa kunci ini, requestAccess
        # langsung ditolak sistem. Hanya dipakai saat pengguna
        # meminta lewat agent; tidak ada akses latar belakang.
        NSCalendarsUsageDescription: "LlamaChat memakai kalender hanya saat kamu meminta lewat agent (mis. melihat jadwal atau membuat acara)."
        NSRemindersUsageDescription: "LlamaChat membuat pengingat hanya saat kamu meminta lewat agent."
        NSContactsUsageDescription: "LlamaChat mencari kontak hanya saat kamu meminta lewat agent."
        # Izin voice note Build 2: mikrofon untuk merekam, pengenalan
        # ucapan untuk mengubah rekaman menjadi teks. Keduanya hanya
        # dipakai saat pengguna menekan tombol mic di composer.
        NSMicrophoneUsageDescription: "LlamaChat memakai mikrofon untuk merekam voice note yang ditranskripsi menjadi pesan."
        NSSpeechRecognitionUsageDescription: "LlamaChat mengubah voice note menjadi teks memakai pengenalan ucapan iOS."
        # Deklarasi tipe dokumen GGUF (2026-11-26): tanpa ini, iOS tidak
        # mengenal ekstensi .gguf — Files tidak menawarkan "Buka di
        # LlamaChat" dan document picker bisa menonaktifkan file .gguf.
        # Identifier org.ggml.gguf mengikuti konvensi ggml; tipe ini
        # conform ke public.data supaya picker + share sheet mengenalinya.
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: org.ggml.gguf
            UTTypeDescription: "GGUF Model"
            UTTypeConformsTo:
              - public.data
            UTTypeTagSpecification:
              public.filename-extension:
                - gguf
              public.mime-type:
                - application/octet-stream
        CFBundleDocumentTypes:
          - CFBundleTypeName: "GGUF Model"
            CFBundleTypeRole: Viewer
            LSHandlerRank: Default
            LSItemContentTypes:
              - org.ggml.gguf
            CFBundleTypeExtensions:
              - gguf
    settings:
      base:
        PRODUCT_NAME: "LlamaChat"
        PRODUCT_BUNDLE_IDENTIFIER: com.bangmujer.llamachat
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1,2"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        INFOPLIST_KEY_CFBundleDisplayName: "LlamaChat"
        # Tanpa signing di CI: IPA unsigned untuk TrollStore, sama seperti MDM.
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: NO
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # llama.xcframework membawa module map sendiri (umbrella "Headers",
        # link c++ / Accelerate / Metal / Foundation). Swift cukup `import llama`.
        # TIDAK ADA bridging header untuk llama.cpp di proyek ini.
        # Swift 6 mode TIDAK diaktifkan di Fase A: kode actor + C pointer
        # ditulis untuk Swift 5.9. Jangan naikkan tanpa audit Sendable.
        SWIFT_APPROACHABLE_CONCURRENCY: NO
